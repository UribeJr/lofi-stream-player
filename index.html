<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoFi Beats</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://use.typekit.net/xya2tnq.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Font Awesome for icons -->
</head>
<body>

    <div id="name-input-container">
        <h2>Welcome to LoFi Beats! 🧇</h2>
        <span class="intro-message">Your hub for chill lofi vibes. Relax, focus, and let the beats set the mood.</span>
        <span class="name-message">Let's start with a little about yourself, what is your name?</span>
        <div style="display: inline-block;">
            <input type="text" id="name-input" placeholder="Enter your name">
            <button id="submit-name-btn">Submit</button>
        </div>
    </div>

    <div class="hamburger" onclick="toggleSidebar()">
    </div>

    <div class="sidebar">
        <div class="profile">
            <img src="music-player-profile-pic.jpg" alt="Profile Picture"> <!-- Update the path to the profile picture -->
            <div class="name">Enrique Uribe</div>
            <div class="github-handle">Github: @UribeJr</div>
        </div>
        <div class="station-list">
            <ul>
                <li>Lofi Beats 👾</li>
                <li>Raining in Japan 🌧️</li>
                <li>Piano - Studying, Relaxing 🎹</li>
            </ul>
        </div>
        <div class="bg-previews">
            <div class="bg-preview" onclick="changeBackground('backgrounds/hakusho.gif', this)" style="background-image: url('backgrounds/hakusho.gif');"></div>
            <div class="bg-preview" onclick="changeBackground('backgrounds/bg.gif', this)" style="background-image: url('backgrounds/bg.gif');"></div>
            <div class="bg-preview" onclick="changeBackground('backgrounds/space.gif', this)" style="background-image: url('backgrounds/space.gif');"></div>
            <div class="bg-preview" onclick="changeBackground('backgrounds/kame_house.jpg', this)" style="background-image: url('backgrounds/kame_house.jpg');"></div>
        </div>
    </div>

    <div class="overlay"></div>
    
    <img id="background-image" class="background-image" src="backgrounds/hakusho.gif">

    <!-- <div class="bg-options">
        <button class="active" id="bg1" onclick="changeBackground('backgrounds/hakusho.gif', this)">Hakusho</button>
        <button id="bg2" onclick="changeBackground('backgrounds/bg.gif', this)">Street Girl</button>
        <button id="bg3" onclick="changeBackground('backgrounds/space.gif', this)">Space</button>
        <button id="bg4" onclick="changeBackground('backgrounds/night-shift.gif', this)">Night Shift</button>
    </div> -->

    <div class="weather">
        <div id="weather-icon"></div>
        <div id="weather-description"></div>
        <div id="temperature"></div>
        <div id="high-low"></div>
    </div>

    <div id="user-name-display"></div>
    <!-- Add info container with shortcut to switch bg's -->
    <!-- <div id="player-info-container">Hello</div> -->

    <div class="container">
        <!-- <button id="playPongBtn" onclick="openPong()">Play Some Pong</button>
        <canvas id="pong" width="400" height="300" style="display: none;"></canvas>
        <div id="score" style="display: none;">Player: 0 | AI: 0</div>
        <button id="closePongBtn" onclick="closePong()" style="display: none;">Close Pong</button> -->
        
        <div class="custom-audio-player">
            <span id="audio-title" class="stream-message"></span>
            <div class="controls">
                <button id="playPauseBtn"><i class="fas fa-play"></i></button>
                <div class="sound-wave" id="soundWave">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div> <!-- Add 6th bar -->
                    <div class="bar"></div> <!-- Add 7th bar -->
                </div>
                <div class="volume-control">
                    <input type="range" id="volume" name="volume" min="0" max="100" value="100">
                </div>
            </div>
        </div>
        <div id="player1"></div>
        <div id="player2"></div>
        <audio id="audio" src="https://usa9.fastcast4u.com/proxy/jamz?mp=/1" preload="auto"></audio>
    </div>

    <!-- <div class="digital-clock" id="clock"></div> Digital clock element -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/css/css.min.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
